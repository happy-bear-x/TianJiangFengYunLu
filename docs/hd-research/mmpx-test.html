<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>MMPX shader 验证</title>
<style>
  body { margin:0; padding:10px; background:#1a1a1e; color:#dcdce4; font:13px/1.6 system-ui,sans-serif; }
  h2 { font-size:15px; margin:0 0 6px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:1400px; }
  .cell h3 { margin:0 0 4px; font-size:12px; font-weight:600; color:#7fc4ff; }
  canvas.out { width:100%; display:block; background:#000; image-rendering:pixelated; border:1px solid #333; }
  #log { margin-top:10px; font-family:ui-monospace,monospace; font-size:12px; white-space:pre-wrap; color:#8ee88e; }
  .err { color:#ff8a8a; }
</style>
</head>
<body>
<h2>MMPX 在 GLES2 fragment shader 里的实现验证</h2>
<div class="grid">
  <div class="cell"><h3>① NEAREST 2.25x（现状）</h3><canvas class="out" id="c1"></canvas></div>
  <div class="cell"><h3>② MMPX 2x + NEAREST 1.125x</h3><canvas class="out" id="c2"></canvas></div>
</div>
<div id="log">initializing...</div>

<script>
const SRC_W = 853, SRC_H = 480;
const DST_W = 1920, DST_H = 1080;

const VERT = `
attribute vec2 aPos;
varying vec2 vUV;
void main(){
  vUV = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const HEAD = `
precision highp float;
uniform sampler2D uTex;
uniform vec2 uSrc;
varying vec2 vUV;
`;

const FRAG_NEAREST = HEAD + `
void main(){
  vec2 p = (floor(vUV * uSrc) + 0.5) / uSrc;
  gl_FragColor = texture2D(uTex, p);
}`;

const FRAG_BILINEAR = HEAD + `
void main(){ gl_FragColor = texture2D(uTex, vUV); }`;

// MMPX 规则逐条移植自官方 MMPX.glc（McGuire & Gagiu 2021, JCGT）
const FRAG_MMPX = HEAD + `
vec4 S(float x, float y){
  vec2 p = (vec2(x, y) + 0.5) / uSrc;
  return texture2D(uTex, p);
}
bool EQ(vec4 a, vec4 b){ return all(lessThan(abs(a - b), vec4(0.0020))); }
bool allEQ2(vec4 b, vec4 a0, vec4 a1){ return EQ(b,a0) && EQ(b,a1); }
bool allEQ3(vec4 b, vec4 a0, vec4 a1, vec4 a2){ return EQ(b,a0)&&EQ(b,a1)&&EQ(b,a2); }
bool allEQ4(vec4 b, vec4 a0, vec4 a1, vec4 a2, vec4 a3){ return EQ(b,a0)&&EQ(b,a1)&&EQ(b,a2)&&EQ(b,a3); }
bool anyEQ3(vec4 b, vec4 a0, vec4 a1, vec4 a2){ return EQ(b,a0)||EQ(b,a1)||EQ(b,a2); }
bool noneEQ2(vec4 b, vec4 a0, vec4 a1){ return !EQ(b,a0) && !EQ(b,a1); }
bool noneEQ4(vec4 b, vec4 a0, vec4 a1, vec4 a2, vec4 a3){ return !EQ(b,a0)&&!EQ(b,a1)&&!EQ(b,a2)&&!EQ(b,a3); }
float lum(vec4 c){ return (c.r + c.g + c.b + 0.00392157) * (1.0 - c.a); }

void main(){
  vec2 dst = floor(gl_FragCoord.xy);
  float sx = floor(dst.x * 0.5);
  float sy = floor(dst.y * 0.5);

  vec4 A = S(sx-1.0, sy-1.0), B = S(sx, sy-1.0), C = S(sx+1.0, sy-1.0);
  vec4 D = S(sx-1.0, sy    ), E = S(sx, sy    ), F = S(sx+1.0, sy    );
  vec4 G = S(sx-1.0, sy+1.0), H = S(sx, sy+1.0), I = S(sx+1.0, sy+1.0);

  vec4 J = E, K = E, L = E, M = E;

  bool isFlat = EQ(A,E)&&EQ(B,E)&&EQ(C,E)&&EQ(D,E)&&EQ(F,E)&&EQ(G,E)&&EQ(H,E)&&EQ(I,E);
  if (!isFlat) {
    vec4 P = S(sx, sy-2.0), S2 = S(sx, sy+2.0);
    vec4 Q = S(sx-2.0, sy), R = S(sx+2.0, sy);
    float Bl = lum(B), Dl = lum(D), El = lum(E), Fl = lum(F), Hl = lum(H);

    if ((EQ(D,B) && !EQ(D,H) && !EQ(D,F)) && (El >= Dl || EQ(E,A)) && anyEQ3(E,A,C,G) && (El < Dl || !EQ(A,D) || !EQ(E,P) || !EQ(E,Q))) J = D;
    if ((EQ(B,F) && !EQ(B,D) && !EQ(B,H)) && (El >= Bl || EQ(E,C)) && anyEQ3(E,A,C,I) && (El < Bl || !EQ(C,B) || !EQ(E,P) || !EQ(E,R))) K = B;
    if ((EQ(H,D) && !EQ(H,F) && !EQ(H,B)) && (El >= Hl || EQ(E,G)) && anyEQ3(E,A,G,I) && (El < Hl || !EQ(G,H) || !EQ(E,S2) || !EQ(E,Q))) L = H;
    if ((EQ(F,H) && !EQ(F,B) && !EQ(F,D)) && (El >= Fl || EQ(E,I)) && anyEQ3(E,C,G,I) && (El < Fl || !EQ(I,H) || !EQ(E,R) || !EQ(E,S2))) M = F;

    if ((!EQ(E,F) && allEQ4(E,C,I,D,Q) && allEQ2(F,B,H)) && !EQ(F, S(sx+3.0, sy))) { K = F; M = F; }
    if ((!EQ(E,D) && allEQ4(E,A,G,F,R) && allEQ2(D,B,H)) && !EQ(D, S(sx-3.0, sy))) { J = D; L = D; }
    if ((!EQ(E,H) && allEQ4(E,G,I,B,P) && allEQ2(H,D,F)) && !EQ(H, S(sx, sy+3.0))) { L = H; M = H; }
    if ((!EQ(E,B) && allEQ4(E,A,C,H,S2) && allEQ2(B,D,F)) && !EQ(B, S(sx, sy-3.0))) { J = B; K = B; }
    if (Bl < El && allEQ4(E,G,H,I,S2) && noneEQ4(E,A,D,C,F)) { J = B; K = B; }
    if (Hl < El && allEQ4(E,A,B,C,P) && noneEQ4(E,D,G,I,F)) { L = H; M = H; }
    if (Fl < El && allEQ4(E,A,D,G,Q) && noneEQ4(E,B,C,I,H)) { K = F; M = F; }
    if (Dl < El && allEQ4(E,C,F,I,R) && noneEQ4(E,B,A,G,H)) { J = D; L = D; }

    if (!EQ(H,B)) {
      if (!EQ(H,A) && !EQ(H,E) && !EQ(H,C)) {
        if (allEQ3(H,G,F,R) && noneEQ2(H,D, S(sx+2.0, sy-1.0))) { L = M; }
        if (allEQ3(H,I,D,Q) && noneEQ2(H,F, S(sx-2.0, sy-1.0))) { M = L; }
      }
      if (!EQ(B,I) && !EQ(B,G) && !EQ(B,E)) {
        if (allEQ3(B,A,F,R) && noneEQ2(B,D, S(sx+2.0, sy+1.0))) { J = K; }
        if (allEQ3(B,C,D,Q) && noneEQ2(B,F, S(sx-2.0, sy+1.0))) { K = J; }
      }
    }
    if (!EQ(F,D)) {
      if (!EQ(D,I) && !EQ(D,E) && !EQ(D,C)) {
        if (allEQ3(D,A,H,S2) && noneEQ2(D,B, S(sx+1.0, sy+2.0))) { J = L; }
        if (allEQ3(D,G,B,P) && noneEQ2(D,H, S(sx+1.0, sy-2.0))) { L = J; }
      }
      if (!EQ(F,E) && !EQ(F,A) && !EQ(F,G)) {
        if (allEQ3(F,C,H,S2) && noneEQ2(F,B, S(sx-1.0, sy+2.0))) { K = M; }
        if (allEQ3(F,I,B,P) && noneEQ2(F,H, S(sx-1.0, sy-2.0))) { M = K; }
      }
    }
  }

  bool oddX = mod(dst.x, 2.0) > 0.5;
  bool oddY = mod(dst.y, 2.0) > 0.5;
  gl_FragColor = oddY ? (oddX ? M : L) : (oddX ? K : J);
}`;

function compile(gl, type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

function makeProgram(gl, frag){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, frag));
  gl.bindAttribLocation(p, 0, 'aPos');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

function makeTex(gl, filter){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

function draw(gl, prog, srcTex, srcW, srcH, outW, outH, targetFbo){
  gl.bindFramebuffer(gl.FRAMEBUFFER, targetFbo || null);
  gl.viewport(0, 0, outW, outH);
  gl.useProgram(prog);
  gl.uniform1i(gl.getUniformLocation(prog, 'uTex'), 0);
  gl.uniform2f(gl.getUniformLocation(prog, 'uSrc'), srcW, srcH);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, srcTex);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function renderToTex(gl, prog, srcTex, srcW, srcH, outW, outH){
  const tex = makeTex(gl, gl.NEAREST);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, outW, outH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  draw(gl, prog, srcTex, srcW, srcH, outW, outH, fbo);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return tex;
}

async function loadImage(url){
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('load fail ' + url));
    im.src = url;
  });
}

async function main(){
  const log = document.getElementById('log');
  try {
    const img = await loadImage('fullscreen-source.png');

    // 缩到逻辑画布 853x480
    const tmp = document.createElement('canvas');
    tmp.width = SRC_W; tmp.height = SRC_H;
    const tctx = tmp.getContext('2d');
    tctx.imageSmoothingEnabled = true;
    tctx.drawImage(img, 0, 0, SRC_W, SRC_H);

    // 唯一的 WebGL context（离屏，1920x1080 足够容纳所有 pass）
    const glc = document.createElement('canvas');
    glc.width = DST_W; glc.height = DST_H;
    const gl = glc.getContext('webgl', {preserveDrawingBuffer:true, antialias:false, premultipliedAlpha:false});
    if (!gl) throw new Error('WebGL 不可用');

    const pMMPX = makeProgram(gl, FRAG_MMPX);
    const pNear = makeProgram(gl, FRAG_NEAREST);
    const pBil  = makeProgram(gl, FRAG_BILINEAR);

    // 顶点缓冲（全屏 quad）
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    // 源纹理
    const srcTex = makeTex(gl, gl.NEAREST);
    gl.bindTexture(gl.TEXTURE_2D, srcTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tmp);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);

    // pass1: MMPX 2x -> 1706x960
    const upTex = renderToTex(gl, pMMPX, srcTex, SRC_W, SRC_H, SRC_W*2, SRC_H*2);

    const shots = {};

    function grab(name, w, h){
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.drawImage(glc, 0, 0, w, h, 0, 0, w, h);
      shots[name] = c.toDataURL('image/png');
      return c;
    }

    // ① 现状 nearest 2.25x
    glc.width = DST_W; glc.height = DST_H;
    draw(gl, pNear, srcTex, SRC_W, SRC_H, DST_W, DST_H, null);
    const img1 = grab('nearest_225', DST_W, DST_H);

    // ② MMPX 2x + nearest 1.125x
    glc.width = DST_W; glc.height = DST_H;
    draw(gl, pNear, upTex, SRC_W*2, SRC_H*2, DST_W, DST_H, null);
    const img2 = grab('mmpx_1125', DST_W, DST_H);

    // ③ MMPX 纯 2x（供 Python 逐像素比对）
    glc.width = SRC_W*2; glc.height = SRC_H*2;
    draw(gl, pNear, upTex, SRC_W*2, SRC_H*2, SRC_W*2, SRC_H*2, null);
    grab('mmpx_2x', SRC_W*2, SRC_H*2);

    // 展示前两张
    const show = (id, src) => {
      const el = document.getElementById(id);
      el.width = src.width; el.height = src.height;
      el.getContext('2d').drawImage(src, 0, 0);
    };
    show('c1', img1);
    show('c2', img2);

    window.__shots = shots;
    window.__ok = true;
    log.textContent = 'OK  shader 编译通过，四种渲染均已完成\n' +
      Object.keys(shots).map(k => '  ' + k).join('\n');
  } catch (e) {
    log.innerHTML = '<span class="err">ERROR: ' + e.message + '</span>';
    window.__ok = false;
  }
}
main();
</script>
</body>
</html>
