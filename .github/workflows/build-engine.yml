name: Build libmkxp-z (arm64-v8a)

on:
  push:
    branches:
      - 'engine/build'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build engine shared library
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ANDROID_NDK_VERSION: 23.2.8568313

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake curl xxd \
            ruby-full autoconf automake libtool pkg-config \
            python3 git unzip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK and install NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "Preinstalled SDK not found, bootstrapping one"
            SDK=/usr/local/lib/android/sdk
            sudo mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline.zip -d /tmp/cmdline
            sudo mv /tmp/cmdline/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK content:"; ls "$SDK" || true
          echo "Installed NDKs:"; ls "$SDK/ndk" 2>/dev/null || echo "(none)"

      - name: Install Android NDK ${{ env.ANDROID_NDK_VERSION }}
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "sdkmanager missing at $SDKM"
            find "$ANDROID_HOME" -name sdkmanager -maxdepth 5 2>/dev/null || true
            exit 1
          fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "ndk;${{ env.ANDROID_NDK_VERSION }}"
          NDK_DIR="$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}"
          test -d "$NDK_DIR" || { echo "NDK dir not created"; ls "$ANDROID_HOME/ndk" || true; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Export NDK toolchain
        run: |
          ARCH=linux-x86_64
          NDK_PATH="$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}"
          echo "ARCH=$ARCH" >> "$GITHUB_ENV"
          echo "$NDK_PATH/toolchains/llvm/prebuilt/$ARCH/bin" >> "$GITHUB_PATH"

      - name: Fetch third-party sources
        working-directory: app/jni
        run: |
          chmod +x get_deps.sh
          ./get_deps.sh
          cd mkxp-z
          chmod +x make_xxd.sh
          ./make_xxd.sh

      - name: Build third-party libraries (arm64-v8a)
        working-directory: app/jni
        run: |
          set -o pipefail
          mkdir -p /tmp/engine-logs
          HOST=aarch64-linux-android \
          TARGET=aarch64-linux-android \
          ABI=arm64-v8a \
          make -j$(nproc) 2>&1 | tee /tmp/engine-logs/deps.log

      - name: Inspect prebuilt artifacts
        working-directory: app/jni
        run: |
          mkdir -p /tmp/engine-logs
          echo "=== build-arm64-v8a/lib ===" > /tmp/engine-logs/artifacts.txt
          ls -la build-arm64-v8a/lib/ >> /tmp/engine-logs/artifacts.txt 2>&1 || true
          echo "=== 全盘找 libopenal.so ===" >> /tmp/engine-logs/artifacts.txt
          find . -name "libopenal.so" >> /tmp/engine-logs/artifacts.txt 2>&1 || true
          echo "=== 全盘找 libruby.so ===" >> /tmp/engine-logs/artifacts.txt
          find . -name "libruby.so*" >> /tmp/engine-logs/artifacts.txt 2>&1 || true
          cat /tmp/engine-logs/artifacts.txt

      - name: Build libmkxp-z.so
        working-directory: app/jni
        run: |
          set -o pipefail
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            APP_ABI=arm64-v8a \
            -j$(nproc) 2>&1 | tee /tmp/engine-logs/mkxp.log

      # 失败时也要能看到日志：actions 日志接口需要管理员权限，
      # 本地只能 git fetch，所以把日志一起推到 engine/prebuilt 分支
      - name: Publish logs on failure
        if: failure()
        run: |
          git config user.name  "engine-ci"
          git config user.email "engine-ci@users.noreply.github.com"
          git fetch origin engine/prebuilt || true
          git checkout -B engine/prebuilt origin/engine/prebuilt
          mkdir -p prebuilt/logs/${{ github.run_id }}
          cp -r /tmp/engine-logs/. prebuilt/logs/${{ github.run_id }}/ 2>/dev/null || true
          git add -f prebuilt/logs/ || true
          git commit -m "CI: build logs from run ${{ github.run_id }}" || true
          git push origin engine/prebuilt

      - name: Show build output
        working-directory: app/jni
        run: |
          ls -la libs/arm64-v8a/ || true
          find . -name "libmkxp-z.so" -maxdepth 4

      - name: Upload shared libraries
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z-libs-arm64
          path: app/jni/libs/arm64-v8a/*.so
          retention-days: 30

      # 产物回传到独立分支：本地只能走 SSH，拿不到 actions artifact，
      # 但 git fetch 能直接从仓库取回编译好的 .so
      - name: Publish shared libraries to engine/prebuilt
        run: |
          set -e
          mkdir -p /tmp/engine-libs
          cp app/jni/libs/arm64-v8a/*.so /tmp/engine-libs/
          git config user.name  "engine-ci"
          git config user.email "engine-ci@users.noreply.github.com"
          git checkout -B engine/prebuilt
          mkdir -p prebuilt/arm64-v8a
          cp /tmp/engine-libs/*.so prebuilt/arm64-v8a/
          git add -f prebuilt/
          git commit -m "CI: prebuilt arm64 libraries from ${GITHUB_SHA}" || true
          git push --force origin engine/prebuilt
